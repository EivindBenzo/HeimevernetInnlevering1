services:
  heimevernet:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Data Source=/app/Data/heimevernet.db"
    volumes:
      - heimevernet-data:/app/Data

volumes:
  heimevernet-data:
